services:
  - type: web
    name: northstar-rag
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /health
    disk:
      name: rag-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: VECTOR_BACKEND
        value: sqlite
      - key: EMBEDDING_BACKEND
        value: hash
      - key: VECTOR_DIR
        value: /data/vector_store
      - key: LLM_PROVIDER
        value: ollama-cloud
      - key: LLM_MODEL
        value: gemma4:31b
      - key: LLM_TIMEOUT_SECONDS
        value: "180"
      - key: OLLAMA_API_KEY
        sync: false
